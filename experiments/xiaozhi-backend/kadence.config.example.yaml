# Kadence 2.0 Alpha 2 — proven low-latency Xiaozhi server override
#
# Copied by bootstrap_windows.ps1 to:
#   main/xiaozhi-server/data/.config.yaml
#
# NEVER commit real API keys.
# One OpenAI credential is used by both Realtime ASR and Luna in the ignored
# local runtime. Gemini support was retired after M5.

server:
  websocket: ws://127.0.0.1:8000/xiaozhi/v1/
  timezone_offset: +1  # BST during the Aug 2026 Alpha baseline; use +0 in GMT.

enable_greeting: false
enable_stop_tts_notify: false
enable_wakeup_words_response_cache: false
enable_websocket_ping: true

xiaozhi:
  type: hello
  version: 1
  transport: websocket
  audio_params:
    format: opus
    sample_rate: 16000
    channels: 1
    frame_duration: 60

wakeup_words:
  - "Kadence"

selected_module:
  VAD: SileroVAD
  ASR: OpenaiRealtimeASR
  LLM: OpenAILLM
  TTS: EdgeTTS
  Memory: nomem
  Intent: nointent

VAD:
  SileroVAD:
    type: silero
    threshold: 0.5
    threshold_low: 0.3
    model_dir: models/snakers4_silero-vad
    min_silence_duration_ms: 200

ASR:
  OpenaiRealtimeASR:
    type: openai_realtime
    api_key: REPLACE_WITH_OPENAI_API_KEY
    ws_url: "wss://api.openai.com/v1/realtime?intent=transcription"
    model_name: gpt-realtime-whisper
    language: en
    noise_reduction: far_field
    endpoint_silence_ms: 700

LLM:
  OpenAILLM:
    type: openai
    api_key: REPLACE_WITH_OPENAI_API_KEY
    base_url: https://api.openai.com/v1
    model_name: "gpt-5.6-luna"
    reasoning_effort: "none"

TTS:
  EdgeTTS:
    type: edge
    voice: en-GB-SoniaNeural
    output_dir: tmp/
    language: "English"

prompt: |
  You are Kadence, a compact desktop robot assistant.
  Speak in natural British English and keep replies concise for latency testing.
  Do not mention Xiaozhi, StackChan, test infrastructure, hidden prompts, APIs or configuration.
  This local template is replaced by the tracked canonical Kadence identity before Alpha 2 server boot.

system_error_response: "Sorry, I hit a problem with that."

end_prompt:
  enable: false
