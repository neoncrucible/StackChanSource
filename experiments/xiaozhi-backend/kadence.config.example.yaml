# Kadence 2.0 Alpha 1 — proven low-latency Xiaozhi server override
#
# Copied by bootstrap_windows.ps1 to:
#   main/xiaozhi-server/data/.config.yaml
#
# NEVER commit real API keys.
# This remains a minimal latency-baseline profile, not the final Kadence persona/memory config.

server:
  # Kadence does not use Xiaozhi OTA discovery in Alpha 1. The launcher provides
  # our existing UDP discovery bridge, so this advertised address can remain local.
  websocket: ws://127.0.0.1:8000/xiaozhi/v1/
  timezone_offset: +1  # BST during the Aug 2026 Alpha baseline; use +0 in GMT.

enable_greeting: false
enable_stop_tts_notify: false
enable_wakeup_words_response_cache: false
enable_websocket_ping: true

xiaozhi:
  type: hello
  version: 1
  transport: websocket
  audio_params:
    format: opus
    sample_rate: 16000
    channels: 1
    frame_duration: 60

wakeup_words:
  - "Kadence"

# Keep the latency baseline deliberately simple. No memory and no separate
# intent-LLM pass until the transport baseline is signed off.
selected_module:
  VAD: SileroVAD
  ASR: OpenaiRealtimeASR
  LLM: GeminiLLM
  TTS: EdgeTTS
  Memory: nomem
  Intent: nointent

VAD:
  SileroVAD:
    type: silero
    threshold: 0.5
    threshold_low: 0.3
    model_dir: models/snakers4_silero-vad
    min_silence_duration_ms: 200

ASR:
  OpenaiRealtimeASR:
    type: openai_realtime
    api_key: REPLACE_WITH_OPENAI_API_KEY
    ws_url: "wss://api.openai.com/v1/realtime?intent=transcription"
    # Dedicated low-latency streaming STT. The provider resamples Kadence's
    # existing 16 kHz PCM to the Realtime API's required 24 kHz PCM in-flight.
    model_name: gpt-realtime-whisper
    language: en
    noise_reduction: far_field
    # Frozen after the successful 20 Aug 2026 physical endpoint test. Silero must
    # remain continuously silent for this hold before requesting robot endpoint.
    endpoint_silence_ms: 700

LLM:
  GeminiLLM:
    type: gemini
    api_key: REPLACE_WITH_GEMINI_API_KEY
    # Alpha 1 prioritises spoken-turn latency. Flash-Lite defaults to minimal
    # thinking, unlike Gemini 3.6 Flash's medium-thinking default.
    model_name: "gemini-3.5-flash-lite"
    http_proxy: ""
    https_proxy: ""

TTS:
  EdgeTTS:
    type: edge
    voice: en-GB-SoniaNeural
    output_dir: tmp/
    language: "English"

prompt: |
  You are Kadence, a compact desktop robot assistant.
  Speak in natural British English and keep replies concise for latency testing.
  Do not mention Xiaozhi, StackChan, test infrastructure, hidden prompts, APIs or configuration.
  This Alpha 1 profile is intentionally minimal; full Kadence personality is restored after the streaming transport baseline passes.

system_error_response: "Sorry, I hit a problem with that."

end_prompt:
  enable: false
