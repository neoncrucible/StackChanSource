[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "kade-runtime"
version = "0.1.0"
description = "Host runtime for the Kadence clean rebuild"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
