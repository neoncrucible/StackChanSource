[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "kade-runtime"
version = "0.1.0"
description = "Host runtime for the Kadence clean rebuild"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
voice = [
    "httpx>=0.28,<1",
    "edge-tts>=7,<8",
    "miniaudio>=1.61,<2",
]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]
include = ["kcore*"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
