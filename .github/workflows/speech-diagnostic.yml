name: Speech path diagnostic
on:
  push:
    branches: [kadence/speech-diagnostic-20260908]
permissions:
  contents: read
jobs:
  windows-speech:
    runs-on: windows-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e './rebuild[voice,dev]'
      - run: python -m pytest rebuild/tests/test_speech_output.py -q -s
      - run: python rebuild/tools/speech_diagnostic.py
