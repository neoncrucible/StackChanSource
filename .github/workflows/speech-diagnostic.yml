name: Speech path diagnostic
on:
  push:
    branches: [kadence/speech-diagnostic-20260908]
permissions:
  contents: read
jobs:
  windows-speech:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e './rebuild[voice,desktop,package]' 'edge-tts==7.2.8' 'miniaudio==1.71' 'aiohttp==3.14.3'
      - run: python rebuild/tools/speech_diagnostic.py
      - run: python -m PyInstaller --noconfirm --clean --onedir --name SpeechProbe --console --hide-console hide-early --collect-submodules kcore --collect-data tzdata --collect-data certifi --collect-all cv2 --hidden-import _cffi_backend rebuild/tools/speech_diagnostic.py
      - run: dist/SpeechProbe/SpeechProbe.exe
