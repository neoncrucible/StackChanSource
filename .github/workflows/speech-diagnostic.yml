name: Speech path diagnostic
on:
  push:
    branches: [kadence/speech-diagnostic-20260908]
permissions:
  contents: read
jobs:
  windows-speech:
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e './rebuild[voice]' 'edge-tts==7.2.8' 'miniaudio==1.71' 'aiohttp==3.14.3'
      - run: python rebuild/tools/speech_diagnostic.py
