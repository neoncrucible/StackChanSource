name: Apply Voice UI foundation v2

on:
  push:
    branches:
      - feature/voice-checkpoint-1

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out voice branch
        uses: actions/checkout@v4
        with:
          ref: feature/voice-checkpoint-1

      - name: Apply deterministic source changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str, marker: str) -> str:
              if old in text:
                  return text.replace(old, new, 1)
              if marker in text:
                  return text
              raise SystemExit(f'{label} anchor not found')

          def regex_once(text: str, pattern: str, replacement: str, label: str, marker: str) -> str:
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE)
              if count == 1:
                  return updated
              if marker in text:
                  return text
              raise SystemExit(f'{label} anchor not found')

          generator_path = Path('firmware/tools/generate_kade_assets.py')
          generator = generator_path.read_text(encoding='utf-8')
          generator = replace_once(
              generator,
              '    "listening_png": Path("optic-eye/listening.png"),\n'
              '    "error_png": Path("optic-eye/error.png"),\n'
              '}\n'
              'BOOT_WAV = Path("audio/boot.wav")\n',
              '    "listening_png": Path("optic-eye/listening.png"),\n'
              '    "listening2_png": Path("optic-eye/listening2.png"),\n'
              '    "error_png": Path("optic-eye/error.png"),\n'
              '}\n'
              'WAV_ASSETS = {\n'
              '    "boot_wav": Path("audio/boot.wav"),\n'
              '    "chirp_wav": Path("audio/chirp.wav"),\n'
              '}\n',
              'generator declarations',
              '"listening2_png": Path("optic-eye/listening2.png")',
          )
          generator = replace_once(
              generator,
              '    wav_path = input_root / BOOT_WAV\n'
              '    wav_description = validate_wav(wav_path)\n'
              '    wav_data = wav_path.read_bytes()\n'
              '    print(f"validated {BOOT_WAV}: {wav_description}, {len(wav_data)} bytes")\n'
              '    arrays.append(("boot_wav", wav_data))\n',
              '    for name, relative_path in WAV_ASSETS.items():\n'
              '        wav_path = input_root / relative_path\n'
              '        wav_description = validate_wav(wav_path)\n'
              '        wav_data = wav_path.read_bytes()\n'
              '        print(f"validated {relative_path}: {wav_description}, {len(wav_data)} bytes")\n'
              '        arrays.append((name, wav_data))\n',
              'generator WAV loop',
              'for name, relative_path in WAV_ASSETS.items()',
          )
          generator_path.write_text(generator, encoding='utf-8')

          main_path = Path('firmware/main/main.cpp')
          main = main_path.read_text(encoding='utf-8')

          main = replace_once(
              main,
              'constexpr uint32_t kIdleMotionConfirmationMs = 1000;\n\n'
              'constexpr uint32_t kTouchEventPress = 1U << 0;\n'
              'constexpr uint32_t kTouchEventRelease = 1U << 1;\n'
              'constexpr uint32_t kTouchEventSwipe = 1U << 2;\n',
              'constexpr uint32_t kIdleMotionConfirmationMs = 1000;\n'
              'constexpr uint32_t kListeningPulseMs = 550;\n'
              'constexpr uint32_t kListeningCueGuardMs = 100;\n'
              'constexpr bool kEnableVoiceUiDiagnosticSwipes = true;\n\n'
              'constexpr uint32_t kTouchEventPress = 1U << 0;\n'
              'constexpr uint32_t kTouchEventRelease = 1U << 1;\n'
              'constexpr uint32_t kTouchEventSwipeForward = 1U << 2;\n'
              'constexpr uint32_t kTouchEventSwipeBackward = 1U << 3;\n',
              'constants',
              'kListeningPulseMs',
          )

          main = replace_once(
              main,
              'lv_image_dsc_t g_blink2_dsc{};\n'
              'lv_image_dsc_t g_listening_dsc{};\n'
              'lv_image_dsc_t g_error_dsc{};\n',
              'lv_image_dsc_t g_blink2_dsc{};\n'
              'lv_image_dsc_t g_listening_dsc{};\n'
              'lv_image_dsc_t g_listening2_dsc{};\n'
              'lv_image_dsc_t g_error_dsc{};\n',
              'listening descriptor',
              'g_listening2_dsc',
          )

          main = replace_once(
              main,
              'struct EyeRuntime {\n'
              '    EyeState state = EyeState::IdlePrimary;\n'
              '    uint32_t state_deadline_ms = 0;\n'
              '    uint32_t next_blink_ms = 0;\n'
              '    uint32_t next_idle_variation_ms = 0;\n'
              '    bool confirmation_active = false;\n'
              '    uint32_t confirmation_deadline_ms = 0;\n'
              '};\n\n'
              'EyeRuntime g_eye_runtime;\n',
              'struct EyeRuntime {\n'
              '    EyeState state = EyeState::IdlePrimary;\n'
              '    uint32_t state_deadline_ms = 0;\n'
              '    uint32_t next_blink_ms = 0;\n'
              '    uint32_t next_idle_variation_ms = 0;\n'
              '    bool confirmation_active = false;\n'
              '    uint32_t confirmation_deadline_ms = 0;\n'
              '};\n\n'
              'enum class VoiceUiState : uint8_t {\n'
              '    Idle,\n'
              '    CuePlaying,\n'
              '    Listening,\n'
              '};\n\n'
              'struct VoiceUiRuntime {\n'
              '    VoiceUiState state = VoiceUiState::Idle;\n'
              '    uint32_t next_pulse_ms = 0;\n'
              '    bool green_frame_visible = true;\n'
              '};\n\n'
              'EyeRuntime g_eye_runtime;\n'
              'VoiceUiRuntime g_voice_ui_runtime;\n',
              'voice state structures',
              'enum class VoiceUiState',
          )

          main = replace_once(
              main,
              'std::atomic<uint32_t> g_head_touch_events{0};\n'
              'std::atomic<bool> g_startup_complete{false};\n\n'
              'bool g_touch_active = false;\n'
              'bool g_touch_swiped = false;\n'
              'int g_head_touch_connection = -1;\n',
              'std::atomic<uint32_t> g_head_touch_events{0};\n'
              'std::atomic<bool> g_startup_complete{false};\n'
              'std::atomic<bool> g_listening_cue_active{false};\n'
              'std::atomic<bool> g_listening_cue_complete{false};\n'
              'std::atomic<bool> g_voice_capture_allowed{false};\n\n'
              'bool g_touch_active = false;\n'
              'bool g_touch_swiped = false;\n'
              'int g_touch_swipe_direction = 0;\n'
              'int g_head_touch_connection = -1;\n\n'
              'bool start_listening_cue_audio();\n'
              'void begin_listening_sequence(uint32_t now);\n'
              'void stop_listening_sequence(uint32_t now);\n',
              'voice globals',
              'g_listening_cue_active',
          )

          main = replace_once(
              main,
              '    g_listening_dsc = make_png_descriptor(kade_assets::listening_png, kade_assets::listening_png_size);\n'
              '    g_error_dsc = make_png_descriptor(kade_assets::error_png, kade_assets::error_png_size);\n',
              '    g_listening_dsc = make_png_descriptor(kade_assets::listening_png, kade_assets::listening_png_size);\n'
              '    g_listening2_dsc = make_png_descriptor(kade_assets::listening2_png, kade_assets::listening2_png_size);\n'
              '    g_error_dsc = make_png_descriptor(kade_assets::error_png, kade_assets::error_png_size);\n',
              'descriptor initialisation',
              'kade_assets::listening2_png',
          )

          voice_update = '''void update_voice_ui(uint32_t now)
          {
              switch (g_voice_ui_runtime.state) {
                  case VoiceUiState::CuePlaying:
                      if (g_listening_cue_complete.exchange(false)) {
                          g_voice_ui_runtime.state = VoiceUiState::Listening;
                          g_voice_ui_runtime.green_frame_visible = true;
                          g_voice_ui_runtime.next_pulse_ms = now + kListeningPulseMs;
                          g_voice_capture_allowed.store(true);
                          show_frame(g_listening2_dsc);
                          mclog::tagInfo(kLogTag,
                                         "listening cue complete; robot microphone capture gate open");
                      }
                      return;

                  case VoiceUiState::Listening:
                      if (deadline_reached(now, g_voice_ui_runtime.next_pulse_ms)) {
                          g_voice_ui_runtime.green_frame_visible =
                              !g_voice_ui_runtime.green_frame_visible;
                          show_frame(g_voice_ui_runtime.green_frame_visible
                                         ? g_listening2_dsc
                                         : g_listening_dsc);
                          g_voice_ui_runtime.next_pulse_ms = now + kListeningPulseMs;
                      }
                      return;

                  case VoiceUiState::Idle:
                  default:
                      return;
              }
          }

          '''
          main = replace_once(
              main,
              'void update_eye_state(uint32_t now)\n{\n',
              voice_update +
              'void update_eye_state(uint32_t now)\n{\n'
              '    if (g_voice_ui_runtime.state != VoiceUiState::Idle) {\n'
              '        return;\n'
              '    }\n\n',
              'voice UI updater',
              'void update_voice_ui(uint32_t now)',
          )

          main = regex_once(
              main,
              r'            case HeadPetGesture::SwipeForward:\n'
              r'            case HeadPetGesture::SwipeBackward:\n'
              r'                g_head_touch_events\.fetch_or\(kTouchEventSwipe\);\n'
              r'                break;',
              '            case HeadPetGesture::SwipeForward:\n'
              '                g_head_touch_events.fetch_or(kTouchEventSwipeForward);\n'
              '                break;\n'
              '            case HeadPetGesture::SwipeBackward:\n'
              '                g_head_touch_events.fetch_or(kTouchEventSwipeBackward);\n'
              '                break;',
              'swipe callback',
              'kTouchEventSwipeForward',
          )

          main = replace_once(
              main,
              '    if ((events & kTouchEventPress) != 0U) {\n'
              '        g_touch_active = true;\n'
              '        g_touch_swiped = false;\n'
              '    }\n\n'
              '    if ((events & kTouchEventSwipe) != 0U) {\n'
              '        g_touch_swiped = true;\n'
              '    }\n',
              '    if ((events & kTouchEventPress) != 0U) {\n'
              '        g_touch_active = true;\n'
              '        g_touch_swiped = false;\n'
              '        g_touch_swipe_direction = 0;\n'
              '    }\n\n'
              '    if ((events & kTouchEventSwipeForward) != 0U) {\n'
              '        g_touch_swiped = true;\n'
              '        g_touch_swipe_direction = 1;\n'
              '    }\n'
              '    if ((events & kTouchEventSwipeBackward) != 0U) {\n'
              '        g_touch_swiped = true;\n'
              '        g_touch_swipe_direction = -1;\n'
              '    }\n',
              'swipe event processing',
              'g_touch_swipe_direction = 1',
          )

          main = replace_once(
              main,
              '    // A clean tap toggles idle movement. Swipes stay available for later voice,\n'
              '    // petting or UI features and never toggle motion accidentally.\n'
              '    if (g_touch_active && !g_touch_swiped) {\n'
              '        g_idle_motion.toggle();\n'
              '        show_idle_motion_confirmation(now);\n'
              '        mclog::tagInfo(kLogTag,\n'
              '                       "touch toggle: idle motion {}",\n'
              '                       g_idle_motion.enabled() ? "enabled" : "disabled");\n'
              '    }\n\n'
              '    g_touch_active = false;\n'
              '    g_touch_swiped = false;\n',
              '    // A clean tap retains the physically signed-off idle-motion toggle.\n'
              '    if (g_touch_active && !g_touch_swiped &&\n'
              '        g_voice_ui_runtime.state == VoiceUiState::Idle) {\n'
              '        g_idle_motion.toggle();\n'
              '        show_idle_motion_confirmation(now);\n'
              '        mclog::tagInfo(kLogTag,\n'
              '                       "touch toggle: idle motion {}",\n'
              '                       g_idle_motion.enabled() ? "enabled" : "disabled");\n'
              '    }\n\n'
              '    // Temporary physical-test gate. The production wake-word callback\n'
              '    // will call the same begin/stop functions without changing UI logic.\n'
              '    if (g_touch_active && g_touch_swiped && kEnableVoiceUiDiagnosticSwipes) {\n'
              '        if (g_touch_swipe_direction > 0) {\n'
              '            begin_listening_sequence(now);\n'
              '        } else if (g_touch_swipe_direction < 0) {\n'
              '            stop_listening_sequence(now);\n'
              '        }\n'
              '    }\n\n'
              '    g_touch_active = false;\n'
              '    g_touch_swiped = false;\n'
              '    g_touch_swipe_direction = 0;\n',
              'touch dispatch',
              'Temporary physical-test gate',
          )

          main = main.replace('boot audio is not a RIFF/WAVE file', 'embedded audio is not a RIFF/WAVE file')
          main = main.replace('boot WAV contains a truncated chunk', 'embedded WAV contains a truncated chunk')
          main = main.replace('unsupported boot WAV:', 'unsupported embedded WAV:')
          main = main.replace('boot WAV contains no PCM frames', 'embedded WAV contains no PCM frames')
          main = main.replace('boot WAV decoded:', 'embedded WAV decoded:')

          old_audio = '''void boot_audio_task(void*)
          {
              AudioCodec* codec = Board::GetInstance().GetAudioCodec();
              if (codec == nullptr) {
                  mclog::tagError(kLogTag, "audio codec unavailable");
                  vTaskDelete(nullptr);
                  return;
              }

              codec->Start();
              codec->EnableOutput(true);

              std::vector<int16_t> pcm;
              if (decode_wav_to_mono(kade_assets::boot_wav, kade_assets::boot_wav_size,
                                     codec->output_sample_rate(), pcm)) {
                  codec->OutputData(pcm);
                  mclog::tagInfo(kLogTag, "boot sound playback complete");
              }

              vTaskDelay(pdMS_TO_TICKS(100));
              codec->EnableOutput(false);
              vTaskDelete(nullptr);
          }
          '''
          new_audio = '''bool play_embedded_wav(const uint8_t* wav, std::size_t wav_size, const char* label)
          {
              AudioCodec* codec = Board::GetInstance().GetAudioCodec();
              if (codec == nullptr) {
                  mclog::tagError(kLogTag, "{} audio codec unavailable", label);
                  return false;
              }

              codec->Start();
              codec->EnableOutput(true);

              std::vector<int16_t> pcm;
              const bool decoded = decode_wav_to_mono(
                  wav, wav_size, codec->output_sample_rate(), pcm);
              if (decoded) {
                  codec->OutputData(pcm);
                  mclog::tagInfo(kLogTag, "{} playback complete", label);
              }

              // Capture remains closed until the speaker path has settled.
              vTaskDelay(pdMS_TO_TICKS(kListeningCueGuardMs));
              codec->EnableOutput(false);
              return decoded;
          }

          void boot_audio_task(void*)
          {
              (void)play_embedded_wav(
                  kade_assets::boot_wav, kade_assets::boot_wav_size, "boot sound");
              vTaskDelete(nullptr);
          }

          void listening_cue_audio_task(void*)
          {
              (void)play_embedded_wav(
                  kade_assets::chirp_wav, kade_assets::chirp_wav_size, "listening chirp");
              g_listening_cue_active.store(false);
              g_listening_cue_complete.store(true);
              vTaskDelete(nullptr);
          }

          bool start_listening_cue_audio()
          {
              if (g_listening_cue_active.exchange(true)) {
                  mclog::tagError(kLogTag, "listening chirp is already active");
                  return false;
              }

              g_listening_cue_complete.store(false);
              const BaseType_t result = xTaskCreate(
                  listening_cue_audio_task,
                  "kade_listen_cue",
                  6144,
                  nullptr,
                  4,
                  nullptr);
              if (result != pdPASS) {
                  g_listening_cue_active.store(false);
                  mclog::tagError(kLogTag, "failed to create listening chirp task");
                  return false;
              }
              return true;
          }

          void begin_listening_sequence(uint32_t now)
          {
              if (g_voice_ui_runtime.state != VoiceUiState::Idle ||
                  g_listening_cue_active.load()) {
                  return;
              }

              // Voice owns the interaction. Fail to the stationary torque-off state.
              g_idle_motion.set_enabled(false);
              g_eye_runtime.confirmation_active = false;
              g_voice_capture_allowed.store(false);
              g_voice_ui_runtime.state = VoiceUiState::CuePlaying;
              g_voice_ui_runtime.green_frame_visible = true;
              show_frame(g_listening2_dsc);

              if (!start_listening_cue_audio()) {
                  g_voice_ui_runtime.state = VoiceUiState::Idle;
                  show_frame(g_error_dsc);
                  g_eye_runtime.confirmation_active = true;
                  g_eye_runtime.confirmation_deadline_ms = now + kIdleMotionConfirmationMs;
                  return;
              }

              mclog::tagInfo(kLogTag,
                             "Kadence wake accepted; green listening frame and chirp started");
          }

          void stop_listening_sequence(uint32_t now)
          {
              if (g_voice_ui_runtime.state == VoiceUiState::Idle) {
                  return;
              }

              g_voice_capture_allowed.store(false);
              g_listening_cue_complete.store(false);
              g_voice_ui_runtime.state = VoiceUiState::Idle;
              g_voice_ui_runtime.next_pulse_ms = 0;
              reset_eye_runtime(now);
              mclog::tagInfo(kLogTag,
                             "listening stopped; microphone gate closed and idle eye restored");
          }
          '''
          main = replace_once(
              main,
              old_audio,
              new_audio,
              'audio task block',
              'void listening_cue_audio_task(void*)',
          )

          main = replace_once(
              main,
              '            process_head_touch_events(now);\n'
              '            g_idle_motion.update();\n',
              '            process_head_touch_events(now);\n'
              '            if (g_voice_ui_runtime.state == VoiceUiState::Idle) {\n'
              '                g_idle_motion.update();\n'
              '            }\n',
              'idle motion update',
              'g_voice_ui_runtime.state == VoiceUiState::Idle',
          )

          main = replace_once(
              main,
              '            g_touch_active = false;\n'
              '            g_touch_swiped = false;\n',
              '            g_touch_active = false;\n'
              '            g_touch_swiped = false;\n'
              '            g_touch_swipe_direction = 0;\n',
              'startup touch reset',
              'g_touch_swipe_direction = 0;',
          )

          main = replace_once(
              main,
              '        update_eye_state(now);\n',
              '        update_voice_ui(now);\n'
              '        update_eye_state(now);\n',
              'UI loop',
              'update_voice_ui(now);',
          )

          main = main.replace(
              'runtime ready; tap head sensor to toggle persistent idle movement',
              'runtime ready; tap toggles idle motion; forward/back swipes test voice UI',
          )

          main_path.write_text(main, encoding='utf-8')
          PY

      - name: Verify intended edits
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'listening2_png' firmware/tools/generate_kade_assets.py
          grep -q 'chirp_wav' firmware/tools/generate_kade_assets.py
          grep -q 'VoiceUiState::Listening' firmware/main/main.cpp
          grep -q 'listening_cue_audio_task' firmware/main/main.cpp

      - name: Commit source foundation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/tools/generate_kade_assets.py firmware/main/main.cpp
          if git diff --cached --quiet; then
            echo "Voice UI foundation already applied."
            exit 0
          fi
          git commit -m "Add listening cue and pulsing voice UI foundation"
          git push origin HEAD:feature/voice-checkpoint-1
