name: Rebuild body firmware

on:
  push:
    branches:
      - kadence/rebuild-kade
    paths:
      - "rebuild/**"
      - ".github/workflows/rebuild-body-firmware.yml"
  pull_request:
    paths:
      - "rebuild/**"
      - ".github/workflows/rebuild-body-firmware.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-host:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up host Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verify Windows runtime and deployment gates
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install -e './rebuild[voice,dev]'
          if ($LASTEXITCODE -ne 0) { throw 'Host install failed' }
          python -m pytest rebuild/tests -q
          if ($LASTEXITCODE -ne 0) { throw 'Windows host tests failed' }
          python rebuild/tools/phase_b_gate.py
          if ($LASTEXITCODE -ne 0) { throw 'Candidate gate failed' }
          python rebuild/tools/phase_a3_voice_wire_gate.py
          if ($LASTEXITCODE -ne 0) { throw 'Voice wire gate failed' }
          foreach ($script in @('deploy.ps1', 'flash_bundle.ps1')) {
              $tokens = $null
              $parseErrors = $null
              $path = Join-Path (Get-Location) "rebuild/tools/$script"
              $null = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$parseErrors)
              if ($parseErrors.Count -ne 0) { throw "$script failed Windows PowerShell parsing" }
          }

  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.4

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify current runtime and safety contracts
        shell: bash
        run: |
          set -euo pipefail
          source "$IDF_PATH/export.sh"
          python -m pip install -e './rebuild[voice,dev]'
          python -m pytest rebuild/tests -q
          python rebuild/tools/phase_b_gate.py
          python rebuild/tools/checkpoint23_gate.py
          python rebuild/tools/phase_a4_gate.py
          python rebuild/tools/phase_a3_cancel_gate.py
          python rebuild/tools/phase_a3_self_init_gate.py
          python rebuild/tools/phase_a3_voice_wire_gate.py
          g++ -std=c++17 -Wall -Wextra -Werror -O2 -fsanitize=address,undefined rebuild/tests/avatar_scene_test.cpp -o /tmp/avatar-scene-test
          /tmp/avatar-scene-test

      - name: Build current ESP32-S3 candidate
        shell: bash
        run: |
          set -euo pipefail
          source "$IDF_PATH/export.sh"
          cd rebuild/firmware
          idf.py build 2>&1 | tee body-build.log

      - name: Collect flashable files
        if: success()
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          python rebuild/tools/package_firmware.py --source-commit "$GITHUB_SHA"


      - name: Upload firmware artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kadence-rc1-firmware
          path: rebuild/dist/Kadence-RC1.zip
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kadence-rebuild-body-build-log
          path: rebuild/firmware/body-build.log
          if-no-files-found: warn
