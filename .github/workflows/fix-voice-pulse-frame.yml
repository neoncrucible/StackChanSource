name: Fix Voice Pulse Frame

on:
  push:
    branches:
      - feature/voice-checkpoint-1

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out voice branch
        uses: actions/checkout@v4
        with:
          ref: feature/voice-checkpoint-1

      - name: Correct active listening pulse frame
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('firmware/main/main.cpp')
          text = path.read_text(encoding='utf-8')
          old = '''                show_frame(g_voice_ui_runtime.green_frame_visible
                               ? g_listening2_dsc
                               : g_listening_dsc);
'''
          new = '''                show_frame(g_voice_ui_runtime.green_frame_visible
                               ? g_listening2_dsc
                               : g_error_dsc);
'''

          if old not in text:
              if new in text:
                  print('Voice pulse mapping is already correct.')
              else:
                  raise SystemExit('Expected listening pulse mapping was not found.')
          else:
              if text.count(old) != 1:
                  raise SystemExit(f'Expected one listening pulse mapping, found {text.count(old)}')
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')

          updated = path.read_text(encoding='utf-8')
          if updated.count(': g_error_dsc);') < 1:
              raise SystemExit('Red error frame is not present in the active listening pulse.')
          PY

      - name: Commit mapping fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/main/main.cpp
          if git diff --cached --quiet; then
            echo "No source change required."
            exit 0
          fi
          git commit -m "Fix active listening pulse to use red error frame"
          git push origin HEAD:feature/voice-checkpoint-1
