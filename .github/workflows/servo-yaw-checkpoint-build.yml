name: Servo yaw checkpoint build

on:
  push:
    branches:
      - feature/servo-yaw-checkpoint
  pull_request:
    paths:
      - "firmware/**"
      - ".github/workflows/servo-yaw-checkpoint-build.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.4

    steps:
      - name: Mark firmware build pending
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error --location \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data "{\"state\":\"pending\",\"context\":\"firmware/servo-yaw\",\"description\":\"ESP-IDF 5.5.4 build running\",\"target_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}"

      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch, validate and embed dependencies
        shell: bash
        run: |
          set -o pipefail
          git config --global core.autocrlf false
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd firmware
          python fetch_repos.py 2>&1 | tee dependency-fetch.log

      - name: Build StackChan firmware
        shell: bash
        run: |
          set -o pipefail
          source "$IDF_PATH/export.sh"
          cd firmware
          idf.py build 2>&1 | tee servo-yaw-build.log

      - name: Collect build diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p build-diagnostics
          if [ -f firmware/dependency-fetch.log ]; then
            cp firmware/dependency-fetch.log build-diagnostics/
            tail -n 200 firmware/dependency-fetch.log > build-diagnostics/dependency-fetch-tail.log
          fi
          if [ -f firmware/servo-yaw-build.log ]; then
            cp firmware/servo-yaw-build.log build-diagnostics/
            tail -n 250 firmware/servo-yaw-build.log > build-diagnostics/servo-yaw-build-tail.log
          fi
          find firmware -maxdepth 2 -type f -name "sdkconfig*" -print > build-diagnostics/sdkconfig-files.txt
          printf 'repository=%s\nref=%s\nsha=%s\nrun_id=%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_REF" "$GITHUB_SHA" "$GITHUB_RUN_ID" \
            > build-diagnostics/build-context.txt

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: servo-yaw-build-diagnostics
          path: build-diagnostics/
          if-no-files-found: warn

      - name: Collect, verify and checksum flashable files
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p firmware-artifacts/bootloader firmware-artifacts/partition_table
          cp firmware/build/bootloader/bootloader.bin firmware-artifacts/bootloader/
          cp firmware/build/partition_table/partition-table.bin firmware-artifacts/partition_table/
          cp firmware/build/*.bin firmware-artifacts/
          cp firmware/build/flasher_args.json firmware-artifacts/
          cp firmware/build/flash_args firmware-artifacts/
          (
            cd firmware-artifacts
            printf 'repository=%s\nref=%s\nsha=%s\nrun_id=%s\nidf_version=5.5.4\ncheckpoint=servo-yaw-v0.1\n' \
              "$GITHUB_REPOSITORY" "$GITHUB_REF" "$GITHUB_SHA" "$GITHUB_RUN_ID" \
              > BUILD_INFO.txt

            python - <<'PY'
          import json
          import shlex
          from pathlib import Path

          root = Path(".")
          manifest = json.loads((root / "flasher_args.json").read_text(encoding="utf-8"))
          expected = {str(path) for path in manifest["flash_files"].values()}
          for relative_path in sorted(expected):
              path = root / relative_path
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"missing or empty manifest file: {relative_path}")

          tokens = shlex.split((root / "flash_args").read_text(encoding="utf-8"))
          listed = {
              tokens[index + 1]
              for index, token in enumerate(tokens[:-1])
              if token.startswith("0x")
          }
          if listed != expected:
              raise SystemExit(
                  f"flash manifest mismatch: flash_args={sorted(listed)}, "
                  f"flasher_args.json={sorted(expected)}"
              )
          print("flash manifests reference the same packaged files")
          PY

            find . -type f ! -name SHA256SUMS -printf '%P\0' \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Upload firmware artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: stackchan-servo-yaw-checkpoint
          path: firmware-artifacts/
          if-no-files-found: error

      - name: Publish firmware build status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_STATUS: ${{ job.status }}
        run: |
          state=failure
          description="ESP-IDF 5.5.4 build failed"
          if [ "$BUILD_STATUS" = "success" ]; then
            state=success
            description="ESP-IDF 5.5.4 build and artifact complete"
          elif [ "$BUILD_STATUS" = "cancelled" ]; then
            state=error
            description="ESP-IDF 5.5.4 build cancelled"
          fi
          curl --fail-with-body --silent --show-error --location \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data "{\"state\":\"$state\",\"context\":\"firmware/servo-yaw\",\"description\":\"$description\",\"target_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}"
