name: Alpha 2 backend tests

on:
  push:
    branches:
      - kadence/2.0-alpha-2
    paths:
      - "experiments/xiaozhi-backend/**"
      - ".github/workflows/alpha2-backend-tests.yml"
  pull_request:
    paths:
      - "experiments/xiaozhi-backend/**"
      - ".github/workflows/alpha2-backend-tests.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Mark backend tests pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body -sS \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"pending","context":"kadence-alpha/backend-tests","description":"M5/M6/M7 project tests running"}'

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Compile project-owned backend modules
        working-directory: experiments/xiaozhi-backend
        run: |
          python -m py_compile kadence_tools.py kadence_session.py kadence_utilities.py kadence_behavior.py

      - name: Run M5 fail-closed boundary suite
        working-directory: experiments/xiaozhi-backend
        run: python test_m5_tool_boundary.py

      - name: Run M6 deterministic utility suite
        working-directory: experiments/xiaozhi-backend
        run: python test_m6_utilities.py

      - name: Run M7 deterministic behaviour suite
        working-directory: experiments/xiaozhi-backend
        run: python test_m7_behavior.py

      - name: Test M7 compatibility with proven M5 runtime
        shell: pwsh
        working-directory: experiments/xiaozhi-backend
        run: ./test_m7_m5_compat.ps1

      - name: Render and syntax-check M7 Control Surface
        shell: pwsh
        working-directory: experiments/xiaozhi-backend
        run: ./test_m7_control_surface_patch.ps1

      - name: Report backend test status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            STATE="success"
            DESCRIPTION="M5/M6/M7 project tests passed"
          else
            STATE="failure"
            DESCRIPTION="M5/M6/M7 project tests failed"
          fi
          curl --fail-with-body -sS \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${STATE}\",\"context\":\"kadence-alpha/backend-tests\",\"description\":\"${DESCRIPTION}\"}"
