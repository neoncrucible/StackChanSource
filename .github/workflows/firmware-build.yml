name: Kade Eye firmware build

on:
  push:
    branches:
      - feature/kade-eye-v0.1
  pull_request:
    paths:
      - "firmware/**"
      - ".github/workflows/firmware-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.4

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch and patch factory dependencies
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd firmware
          python fetch_repos.py

      - name: Build Kade Eye firmware
        shell: bash
        run: |
          set -o pipefail
          source "$IDF_PATH/export.sh"
          cd firmware
          idf.py build 2>&1 | tee kade-eye-build.log

      - name: Collect build diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p build-diagnostics
          if [ -f firmware/kade-eye-build.log ]; then
            cp firmware/kade-eye-build.log build-diagnostics/
            tail -n 250 firmware/kade-eye-build.log > build-diagnostics/kade-eye-build-tail.log
          fi
          find firmware -maxdepth 2 -type f -name "sdkconfig*" -print > build-diagnostics/sdkconfig-files.txt

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kade-eye-v0.1-build-diagnostics
          path: build-diagnostics/
          if-no-files-found: warn

      - name: Collect flashable files
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          source "$IDF_PATH/export.sh"
          mkdir -p firmware-artifacts

          cp firmware/build/bootloader/bootloader.bin firmware-artifacts/
          cp firmware/build/partition_table/partition-table.bin firmware-artifacts/
          cp firmware/build/*.bin firmware-artifacts/
          cp firmware/build/flasher_args.json firmware-artifacts/
          cp firmware/build/flash_args firmware-artifacts/

          esptool.py --chip esp32s3 merge_bin \
            -o firmware-artifacts/kade-eye-v0.1-full.bin \
            --flash_mode dio \
            --flash_freq 80m \
            --flash_size 16MB \
            0x0 firmware/build/bootloader/bootloader.bin \
            0x20000 firmware/build/stack-chan.bin \
            0x8000 firmware/build/partition_table/partition-table.bin \
            0xd000 firmware/build/ota_data_initial.bin \
            0xa00000 firmware/build/generated_assets.bin

          cat > firmware-artifacts/FLASHING.txt <<'EOF'
          Kade Eye v0.1 — ESP32-S3 full flash image

          Put StackChan into download mode, then run this from PowerShell inside
          the extracted artifact folder:

          & "$env:LOCALAPPDATA\Programs\Python\Python314\python.exe" -m esptool --chip esp32s3 --port COM4 --baud 921600 write_flash 0x0 .\kade-eye-v0.1-full.bin

          The full image contains the bootloader, partition table, application,
          OTA data and Kade Eye assets partition.
          EOF

          sha256sum firmware-artifacts/kade-eye-v0.1-full.bin > firmware-artifacts/SHA256SUMS.txt

      - name: Upload firmware artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: stackchan-kade-eye-v0.1
          path: firmware-artifacts/
          if-no-files-found: error
