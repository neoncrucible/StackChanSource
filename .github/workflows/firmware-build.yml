name: Factory firmware build

on:
  push:
    branches:
      - feature/kade-firmware-bootstrap
      - kadence/2.0-alpha-1
      - kadence/2.0-alpha-2
  pull_request:
    paths:
      - "firmware/**"
      - ".github/workflows/firmware-build.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.4

    steps:
      - name: Mark firmware build pending
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body -sS \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"pending","context":"kadence-alpha/firmware-build","description":"ESP-IDF 5.5.4 build running"}'

      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch and patch factory dependencies
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd firmware
          python fetch_repos.py

      - name: Build StackChan factory firmware
        shell: bash
        run: |
          set -o pipefail
          source "$IDF_PATH/export.sh"
          cd firmware
          idf.py build 2>&1 | tee factory-build.log

      - name: Collect build diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p build-diagnostics
          if [ -f firmware/factory-build.log ]; then
            cp firmware/factory-build.log build-diagnostics/
            tail -n 200 firmware/factory-build.log > build-diagnostics/factory-build-tail.log
          fi
          find firmware -maxdepth 2 -type f -name "sdkconfig*" -print > build-diagnostics/sdkconfig-files.txt

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stackchan-build-diagnostics
          path: build-diagnostics/
          if-no-files-found: warn

      - name: Collect flashable files
        if: success()
        shell: bash
        run: |
          mkdir -p firmware-artifacts
          cp firmware/build/bootloader/bootloader.bin firmware-artifacts/
          cp firmware/build/partition_table/partition-table.bin firmware-artifacts/
          cp firmware/build/*.bin firmware-artifacts/
          cp firmware/build/flasher_args.json firmware-artifacts/
          cp firmware/build/flash_args firmware-artifacts/

      - name: Upload firmware artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: stackchan-factory-firmware
          path: firmware-artifacts/
          if-no-files-found: error

      - name: Report firmware build status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            STATE="success"
            DESCRIPTION="ESP-IDF 5.5.4 build passed"
          else
            STATE="failure"
            DESCRIPTION="ESP-IDF 5.5.4 build failed"
          fi
          curl --fail-with-body -sS \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${STATE}\",\"context\":\"kadence-alpha/firmware-build\",\"description\":\"${DESCRIPTION}\"}"
