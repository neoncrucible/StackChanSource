name: Import Kadence voice assets

on:
  push:
    branches:
      - feature/voice-checkpoint-1
  pull_request:
    branches:
      - feature/alpha1-startup-foundation

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out voice branch
        uses: actions/checkout@v4
        with:
          ref: feature/voice-checkpoint-1

      - name: Download and verify prepared assets
        shell: bash
        env:
          ASSET_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-25f4-81f4-9f56-765b9d9e6691/raw?se=2026-07-29T20:21:52Z&sp=r&sv=2026-02-06&sr=b&scid=477e8387-bd31-507b-a1f1-01ca89998428&skoid=e32cbaad-a1eb-4299-9f16-1b364ab43781&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-28T23:55:16Z&ske=2026-07-30T23:55:16Z&sks=b&skv=2026-02-06&sig=4ucso47WwdBYh6fSXUSGnwd6z/VhJWYaSeJ6B1lhwQk%3D"
          ASSET_SHA256: "f70f2bcd5f3d76b302f9275e09ec84723d868d3ce47998a5592c1ec6d04e3720"
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --location "$ASSET_URL" -o /tmp/kadence-voice-assets.zip
          printf '%s  %s\n' "$ASSET_SHA256" /tmp/kadence-voice-assets.zip | sha256sum -c -
          rm -rf /tmp/kadence-voice-assets
          mkdir -p /tmp/kadence-voice-assets
          unzip -q /tmp/kadence-voice-assets.zip -d /tmp/kadence-voice-assets

      - name: Validate and install assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import struct
          import wave
          from pathlib import Path

          root = Path('/tmp/kadence-voice-assets')
          image = root / 'listening2.png'
          chirp = root / 'chirp.wav'

          data = image.read_bytes()
          if len(data) < 24 or data[:8] != b'\x89PNG\r\n\x1a\n' or data[12:16] != b'IHDR':
              raise SystemExit('listening2.png is not a valid PNG')
          dimensions = struct.unpack('>II', data[16:24])
          if dimensions != (320, 240):
              raise SystemExit(f'listening2.png must be 320x240, got {dimensions}')

          with wave.open(str(chirp), 'rb') as wav:
              if wav.getcomptype() != 'NONE':
                  raise SystemExit('chirp.wav must be uncompressed PCM')
              if wav.getnchannels() not in (1, 2):
                  raise SystemExit('chirp.wav must be mono or stereo')
              if wav.getsampwidth() not in (1, 2, 3, 4):
                  raise SystemExit('chirp.wav sample width is unsupported')
              if wav.getframerate() <= 0 or wav.getnframes() <= 0:
                  raise SystemExit('chirp.wav is empty or invalid')
              duration = wav.getnframes() / wav.getframerate()
              if not 0.5 <= duration <= 2.0:
                  raise SystemExit(f'chirp.wav duration is outside the approved cue window: {duration:.3f}s')

          print(f'validated listening2.png: {dimensions[0]}x{dimensions[1]}')
          print(f'validated chirp.wav: {duration:.6f}s')
          PY

          mkdir -p firmware/assets/optic-eye firmware/assets/audio
          cp /tmp/kadence-voice-assets/listening2.png firmware/assets/optic-eye/listening2.png
          cp /tmp/kadence-voice-assets/chirp.wav firmware/assets/audio/chirp.wav

      - name: Commit imported assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/assets/optic-eye/listening2.png firmware/assets/audio/chirp.wav
          if git diff --cached --quiet; then
            echo "Voice assets already match; no commit required."
            exit 0
          fi
          git commit -m "Add Kadence listening avatar and chirp cue"
          git push origin HEAD:feature/voice-checkpoint-1
