name: Kadence functionality host regression

on:
  push:
    branches: [kadence/functionality]
    paths:
      - 'rebuild/backend/**'
      - 'rebuild/tests/**'
      - 'rebuild/unitv2/**'
      - 'rebuild/pyproject.toml'
      - 'rebuild/docs/DESKTOP_INSTALL_UPDATE.md'
      - 'rebuild/docs/CAMERA_PERCEPTION.md'
      - 'rebuild/docs/UNITV2_LIFECYCLE.md'
      - 'rebuild/docs/REFLEX_OBSERVATION.md'
      - 'rebuild/tools/phase_a4_gate.py'
      - 'rebuild/tools/package_desktop.py'
      - 'rebuild/tools/prepare_face_models.py'
      - 'rebuild/tools/desktop_frozen_check.py'
      - 'rebuild/tools/install_desktop.ps1'
      - 'rebuild/tools/Install-Kadence.cmd'
      - '.github/workflows/kadence-functionality-host.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  voice-alignment:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install host test dependencies
        run: python -m pip install -e "./rebuild[voice,desktop,package,dev]"
      - name: Prepare verified local face models
        run: python rebuild/tools/prepare_face_models.py rebuild/dist/face_models
      - name: Camera, privacy and perception regression
        env:
          KADENCE_TEST_MODELS: rebuild/dist/face_models
        run: python -m pytest rebuild/tests/test_perception_runtime.py rebuild/tests/test_perception_desktop.py rebuild/tests/test_schema_v4.py rebuild/tests/test_unitv2_network.py rebuild/tests/test_unitv2_lifecycle.py -q
      - name: Observe-only reflex and desktop regression
        run: python -m pytest rebuild/tests/test_reflex.py rebuild/tests/test_reflex_integration.py -q
      - name: Voice completion and recovery regression
        run: python -m pytest rebuild/tests/test_appliance_candidate.py rebuild/tests/test_voice_failures.py rebuild/tests/test_rc2_media.py rebuild/tests/test_provider_selection.py rebuild/tests/test_ollama_models.py rebuild/tests/test_thinking.py rebuild/tests/test_phase_b.py rebuild/tests/test_desktop.py rebuild/tests/test_desktop_installer.py -q
      - name: Runtime ownership and alignment gate
        run: python rebuild/tools/phase_a4_gate.py
      - name: Streaming speech, cancellation and latency regression
        run: python -m pytest rebuild/tests/test_speech_output.py rebuild/tests/test_speech_stream.py rebuild/tests/test_voice_latency.py rebuild/tests/test_windows_audio_routing.py -q
      - name: Build and exercise the Windows executable
        run: python rebuild/tools/package_desktop.py --source-commit "${{ github.sha }}" --host-only
      - uses: actions/upload-artifact@v4
        with:
          name: Kadence-Desktop-Windows
          path: rebuild/dist/Kadence-Desktop-*.zip
          if-no-files-found: error
          compression-level: 0
