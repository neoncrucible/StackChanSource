name: Kadence functionality host regression

on:
  push:
    branches: [main]
    paths:
      - 'rebuild/backend/**'
      - 'rebuild/firmware/**'
      - 'rebuild/tools/package_firmware.py'
      - 'rebuild/tests/**'
      - 'rebuild/unitv2/**'
      - 'rebuild/sticks3/**'
      - 'rebuild/tools/package_sticks3.py'
      - 'rebuild/pyproject.toml'
      - 'rebuild/docs/DESKTOP_INSTALL_UPDATE.md'
      - 'rebuild/docs/CAMERA_PERCEPTION.md'
      - 'rebuild/docs/UNITV2_LIFECYCLE.md'
      - 'rebuild/docs/REFLEX_OBSERVATION.md'
      - 'rebuild/tools/phase_a4_gate.py'
      - 'rebuild/tools/package_desktop.py'
      - 'rebuild/tools/prepare_face_models.py'
      - 'rebuild/tools/prepare_face_fixtures.py'
      - 'rebuild/tools/desktop_frozen_check.py'
      - 'rebuild/tools/baseline_audit.py'
      - 'rebuild/tools/install_desktop.ps1'
      - 'rebuild/tools/Install-Kadence.cmd'
      - '.github/workflows/kadence-functionality-host.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  body-firmware:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.4
    steps:
      - uses: actions/checkout@v4
      - name: Speech endpoint, pause and hard-limit regression
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror -O2 -fsanitize=address,undefined rebuild/tests/speech_endpoint_test.cpp -o /tmp/speech-endpoint-test
          /tmp/speech-endpoint-test
      - name: Build CoreS3 with speech endpointing
        shell: bash
        run: |
          set -euo pipefail
          source "$IDF_PATH/export.sh"
          cd rebuild/firmware
          idf.py build
      - name: Verify startup stack and package matching firmware
        shell: bash
        run: |
          set -euo pipefail
          source "$IDF_PATH/export.sh"
          python rebuild/tools/boot_stack_gate.py --build rebuild/firmware/build
          python rebuild/tools/package_firmware.py --source-commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: Kadence-CoreS3-Firmware
          path: rebuild/dist/Kadence-RC2-Firmware-*.zip
          if-no-files-found: error
  sticks3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: sticks3-pio-${{ hashFiles('rebuild/sticks3/platformio.ini') }}
          restore-keys: sticks3-pio-
      - run: python -m pip install platformio==6.1.18
      - run: python rebuild/tools/package_sticks3.py --source-commit "${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        with:
          name: Kadence-StickS3-Firmware
          path: rebuild/dist/StickS3
          if-no-files-found: error
  voice-alignment:
    needs: [sticks3]
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install host test dependencies
        run: python -m pip install -e "./rebuild[voice,desktop,package,dev]"
      - name: Prepare verified local face models
        run: python rebuild/tools/prepare_face_models.py rebuild/dist/face_models
      - name: Prepare pinned face evaluation media
        run: python rebuild/tools/prepare_face_fixtures.py rebuild/dist/face_fixtures
      - name: Camera, privacy and perception regression
        env:
          KADENCE_TEST_MODELS: rebuild/dist/face_models
          KADENCE_TEST_FACE_FIXTURES: rebuild/dist/face_fixtures
        run: python -m pytest rebuild/tests/test_perception_runtime.py rebuild/tests/test_perception_desktop.py rebuild/tests/test_vision_console.py rebuild/tests/test_vision_description.py rebuild/tests/test_face_review.py rebuild/tests/test_live_faces.py rebuild/tests/test_camera_diagnostics.py rebuild/tests/test_camera_reconnect.py rebuild/tests/test_schema_v4.py rebuild/tests/test_unitv2_network.py rebuild/tests/test_unitv2_lifecycle.py rebuild/tests/test_unitv2_setup.py rebuild/tests/test_native_unitv2.py rebuild/tests/test_object_tracking.py -q
      - name: Observe-only reflex and desktop regression
        run: python -m pytest rebuild/tests/test_reflex.py rebuild/tests/test_reflex_integration.py rebuild/tests/test_presence_console.py rebuild/tests/test_baseline_audit.py -q
      - name: Autonomous perception, rate limits and visit semantics
        run: python -m pytest rebuild/tests/test_autonomous_perception.py rebuild/tests/test_retail_requests.py rebuild/tests/test_reactive_tracking.py rebuild/tests/test_grounded_companion.py rebuild/tests/test_natural_requests.py rebuild/tests/test_reminders.py rebuild/tests/test_body_flash.py -q
      - name: Voice completion and recovery regression
        run: python -m pytest rebuild/tests/test_appliance_candidate.py rebuild/tests/test_voice_failures.py rebuild/tests/test_voice_recovery.py rebuild/tests/test_audio_network.py rebuild/tests/test_database_shutdown.py rebuild/tests/test_interaction_feedback.py rebuild/tests/test_rc2_media.py rebuild/tests/test_provider_selection.py rebuild/tests/test_ollama_models.py rebuild/tests/test_thinking.py rebuild/tests/test_phase_b.py rebuild/tests/test_desktop.py rebuild/tests/test_desktop_installer.py -q
      - name: Runtime ownership and alignment gate
        run: python rebuild/tools/phase_a4_gate.py
      - name: Streaming speech, cancellation and latency regression
        run: python -m pytest rebuild/tests/test_speech_output.py rebuild/tests/test_speech_stream.py rebuild/tests/test_voice_latency.py rebuild/tests/test_windows_audio_routing.py rebuild/tests/test_speech_workers.py -q
      - name: Remote and shared motion regression
        run: python -m pytest rebuild/tests/test_remote.py rebuild/tests/test_motion.py rebuild/tests/test_stick_package.py -q
      - uses: actions/download-artifact@v4
        with:
          name: Kadence-StickS3-Firmware
          path: rebuild/dist/StickS3
      - name: Build and exercise the Windows executable
        run: python rebuild/tools/package_desktop.py --source-commit "${{ github.sha }}" --host-only
      - uses: actions/upload-artifact@v4
        with:
          name: Kadence-Desktop-Windows
          path: rebuild/dist/Kadence-Desktop-*.zip
          if-no-files-found: error
          compression-level: 0
